name: Build and test

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      package_release:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - shell: cmd
        run: build.bat
      - name: Package Windows VST3
        if: inputs.package_release
        shell: bash
        run: |
          python scripts/package-release.py windows \
            "build/windows/src/plugin/OcarinaVST_artefacts/Release/VST3/Ocarina of Resonance.vst3" dist
      - uses: actions/upload-artifact@v4
        if: inputs.package_release
        with:
          name: release-windows
          path: dist/*.vst3.zip
          if-no-files-found: error

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install Emscripten
        working-directory: .
        run: |
          git clone --depth 1 --branch 7.0.0 https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/ocarina-emsdk"
          "$RUNNER_TEMP/ocarina-emsdk/emsdk" install 7.0.0
          "$RUNNER_TEMP/ocarina-emsdk/emsdk" activate 7.0.0
          echo "EMSDK=$RUNNER_TEMP/ocarina-emsdk" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm run build
      - run: npx playwright-core install --with-deps chromium
      - run: npm test
      - name: Package tested web output
        if: inputs.package_release
        working-directory: .
        run: |
          git diff --exit-code -- docs/index.html docs/assets/*.js docs/assets/*.css docs/assets/parameters.json docs/assets/ocarina.webp
          python scripts/package-release.py web docs dist
      - uses: actions/upload-artifact@v4
        if: inputs.package_release
        with:
          name: release-web
          path: dist/*.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: Web-static
          path: docs/
          include-hidden-files: true
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - name: Install Android toolchain
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-36 build-tools;36.0.0 ndk;29.0.14206865 cmake;3.31.6'
      - name: Build Android ARM64 debug APK
        working-directory: android
        run: sh ./gradlew assembleDebug
      - name: Verify and package the debug APK
        run: |
          python scripts/package-release.py android debug \
            --apk android/app/build/outputs/apk/debug/app-debug.apk --output dist
      - uses: actions/upload-artifact@v4
        with:
          name: Android-ARM64-debug
          path: dist/*-debug.apk
          if-no-files-found: error
