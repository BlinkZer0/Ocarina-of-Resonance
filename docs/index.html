<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ocarina of Resonance</title>
  <meta name="description" content="Play a physically modeled vessel flute in your browser.">
  <link rel="stylesheet" href="./assets/style.css?v=0.2.0">
  <script type="module" src="./assets/main.js?v=0.2.0"></script>
</head>
<body>
  <main>
    <h1>Ocarina of Resonance</h1>
    <p class="version">Physical-model prototype · v0.2.0</p>
    <button id="start" type="button">Start audio</button>
    <p id="status" role="status">Start audio, then hold a note to play.</p>
    <div class="settings">
      <label>Sound model
        <select id="model">
          <option value="0">Ceramic Authentic</option>
          <option value="1">Retro Fantasy</option>
          <option value="2">Crystal Resonator</option>
          <option value="3">Electronic Hybrid</option>
        </select>
      </label>
      <label>Polyphony
        <select id="polyphony"><option value="0">Mono legato</option></select>
      </label>
    </div>
    <fieldset id="keys" disabled>
      <legend>Play a note</legend>
      <div class="keys">
        <button data-note="60" type="button">C4</button>
        <button data-note="64" type="button">E4</button>
        <button data-note="67" type="button">G4</button>
        <button data-note="69" type="button">A4</button>
      </div>
    </fieldset>
    <label for="meter">Output</label>
    <meter id="meter" min="0" max="1" value="0"></meter>
  </main>
</body>
</html>
